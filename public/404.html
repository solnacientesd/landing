<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Página no encontrada — Sol Naciente</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23FFD60A'/%3E%3Ccircle cx='50' cy='50' r='43' fill='none' stroke='%230a0a0b' stroke-width='3'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='34' fill='%230a0a0b'%3ESOL%3C/text%3E%3C/svg%3E"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(60% 50% at 50% 40%, rgba(255, 214, 10, 0.08), transparent 70%), #0a0a0b;
        color: #fff;
        font-family: "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main {
        max-width: 30rem;
      }
      .badge {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        filter: drop-shadow(0 8px 24px rgba(255, 214, 10, 0.25));
      }
      .code {
        margin: 0;
        color: #ffd60a;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 14px;
        font-size: clamp(1.9rem, 6vw, 2.6rem);
        line-height: 1.05;
        letter-spacing: -0.025em;
      }
      h1 span {
        color: #ffd60a;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
        line-height: 1.45;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        padding: 14px 22px;
        border-radius: 10px;
        background: #ffd60a;
        color: #0a0a0b;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 18px 40px -14px rgba(255, 214, 10, 0.55);
        transition:
          transform 0.3s,
          background-color 0.3s;
      }
      a.btn:hover {
        transform: translateY(-2px);
        background: #ffe14d;
      }
      a.btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(255, 214, 10, 0.4);
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="badge" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="50" fill="#ffd60a" />
        <circle cx="50" cy="50" r="43.5" fill="none" stroke="#0a0a0b" stroke-width="2.6" />
        <path d="M41 35a9 9 0 0 1 18 0z" fill="#0a0a0b" />
        <line x1="32" y1="35" x2="68" y2="35" stroke="#0a0a0b" stroke-width="2.2" stroke-linecap="round" />
        <text x="50" y="64" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="27" fill="#0a0a0b">SOL</text>
        <rect x="16" y="67" width="68" height="15" rx="4" fill="#0a0a0b" />
        <text x="50" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="9.4" letter-spacing="0.7" fill="#ffd60a">NACIENTE</text>
      </svg>
      <p class="code">Error 404</p>
      <h1>Esta página <span>no existe.</span></h1>
      <p>El enlace puede estar mal escrito o la página fue movida. Volvé al inicio para ver el Showroom Digital.</p>
      <a class="btn" id="home" href="/">
        Volver al inicio
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </main>
    <script>
      // En sitios de proyecto (usuario.github.io/repo/) el inicio es "/repo/".
      // En sitios de usuario o dominio propio es "/".
      // Se verifica que "/<segmento>/" exista realmente antes de usarlo.
      (function () {
        var seg = location.pathname.split("/")[1];
        if (!seg || !window.fetch) return;
        var candidate = "/" + seg + "/";
        fetch(candidate, { method: "HEAD", cache: "no-store" })
          .then(function (r) {
            if (r.ok) document.getElementById("home").href = candidate;
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
